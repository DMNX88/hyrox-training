","Beban Men Open":"2 x 24 kg","Ada di gym?":"Ya","Substitusi di program":"KB/DB farmers carry 2 x 24 kg","Catatan":"Overload 2x26 kg hanya bila grip dan posture stabil","Sumber":"https://hyrox.com/wp-content/uploads/2025/07/25_26_HYROX_RulebookSingles_EN.pdf","_row":8},{"Urutan":"8","Komponen resmi HYROX":"Sandbag Lunge","Distance/Reps resmi":"100 m","Beban Men Open":"20 kg","Ada di gym?":"Ya","Substitusi di program":"Sandbag lunge 20 kg","Catatan":"Puncak 100 m pada 13 Juni, lalu taper","Sumber":"https://hyrox.com/wp-content/uploads/2025/07/25_26_HYROX_RulebookSingles_EN.pdf","_row":9},{"Urutan":"9","Komponen resmi HYROX":"Wall Balls","Distance/Reps resmi":"100 reps","Beban Men Open":"6 kg ke target 3.0 m","Ada di gym?":"Mungkin","Substitusi di program":"Wall ball 6 kg; fallback med-ball thruster 6 kg","Catatan":"Latih no-rep avoidance dan set plan","Sumber":"https://hyrox.com/wp-content/uploads/2025/07/25_26_HYROX_RulebookSingles_EN.pdf","_row":10}],"sources":[{"Tipe":"Official rulebook","Sumber / URL":"https://hyrox.com/wp-content/uploads/2025/07/25_26_HYROX_RulebookSingles_EN.pdf","Dipakai untuk":"Format race, station order, distance, dan weights Men Open","Catatan":"Season 25/26 HYROX Singles Rulebook","_row":2},{"Tipe":"Assumption","Sumber / URL":"User-provided profile","Dipakai untuk":"Age 34, Men, BW 70 kg, height 170 cm, muscle mass 31.5 kg, VO2max Garmin 51","Catatan":"Digunakan untuk load range dan taper/recovery","_row":3},{"Tipe":"Assumption","Sumber / URL":"User-provided gym availability","Dipakai untuk":"Tidak ada sled push, sled pull, SkiErg","Catatan":"Program memakai substitusi gym konvensional","_row":4},{"Tipe":"Programming rule","Sumber / URL":"RPE-based load selection","Dipakai untuk":"Beban kg disesuaikan bila RPE terlalu tinggi","Catatan":"Karena data 1RM dan race time belum diberikan","_row":5}]}</script>
<script>
const app=JSON.parse(document.getElementById('app-data').textContent);
const $=(q,root=document)=>root.querySelector(q);const $$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const fmtDate=(iso)=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});};
const fmtShort=(iso)=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});};
const esc=(s)=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const storageOK=(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}})();
const getLS=(k,d='')=>storageOK?(localStorage.getItem(k)??d):d;const setLS=(k,v)=>{if(storageOK)localStorage.setItem(k,v)};
function initHero(){
  $('#profileLine').textContent=app.meta.profile+' | '+app.meta.gym;
  const m=app.meta.metrics;
  $('#metrics').innerHTML=[['Hari',m.days],['Training',m.trainingDays],['Rest',m.restDays],['Run km',m.totalRunKm]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
}
function dayStatusPill(s){let cls=s==='Rest'?'rest':(s==='Race'?'race':'train');return `<span class="pill ${cls}">${esc(s||'Training')}</span>`}
function renderItem(it){
  const done=getLS('done:'+it._id,'0')==='1';
  return `<div class="item ${done?'done':''}" data-item="${esc(it._id)}"><div class="checkrow"><input type="checkbox" ${done?'checked':''} aria-label="done"><div><strong>${esc(it['Aktivitas'])}</strong><br><span>${esc(it['Jenis gerakan / fokus'])}</span><div class="tagline"><span class="tag">${esc(it['Format'])}</span><span class="tag">${esc(it['Alat yang dibutuhkan'])}</span><span class="tag">Beban: ${esc(it['Beban (kg)'])}</span><span class="tag">RPE ${esc(it['RPE Target'])}</span></div></div></div><div class="kv" style="margin-top:10px"><div>Volume</div><div>${esc(it['Volume / Repetisi / Jarak'])}</div><div>Durasi</div><div>${esc(it['Durasi (menit)'])} menit</div><div>Intensitas</div><div>${esc(it['Intensitas / Pace'])}</div><div>Catatan</div><div>${esc(it['Catatan'])}</div><div>Alternatif</div><div>${esc(it['Alternatif bila alat tidak ada'])}</div></div></div>`;
}
function renderDayBlock(d, open=false){
  const s=d.summary||{}; const iso=s.Tanggal||''; const items=d.items||[];
  return `<details ${open?'open':''} data-date="${esc(iso)}" data-week="${esc(s.Minggu)}" data-status="${esc(s.Status)}"><summary><div class="row"><div><div class="sum-title">${fmtDate(iso)}</div><div class="sum-meta">${esc(s.Minggu)} | ${esc(s.Fase)} | ${esc(s['Fokus harian'])}</div></div>${dayStatusPill(s.Status)}</div><div class="tagline"><span class="tag">${esc(s['Estimasi durasi (menit)'])} menit</span><span class="tag">${esc(s['Estimasi run (km)'])} km run</span><span class="tag">RPE ${esc(s['RPE target'])}</span></div></summary><div class="items"><div class="notice">${esc(s.Catatan||'')}</div>${items.map(renderItem).join('')}</div></details>`;
}
function currentIndex(){
  const today=new Date(); const todayIso=today.toISOString().slice(0,10);
  let idx=app.days.findIndex(d=>(d.summary||{}).Tanggal>=todayIso);
  if(idx<0) idx=app.days.length-1;
  return idx;
}
function renderToday(){
  const idx=currentIndex(); const d=app.days[idx]; const prev=app.days[Math.max(0,idx-1)]; const next=app.days[Math.min(app.days.length-1,idx+1)];
  $('#today').innerHTML=`<div class="card"><h2>Sesi terdekat</h2><p class="muted small">Jika tanggal iPhone belum berada dalam periode program, halaman ini menampilkan sesi berikutnya.</p>${renderDayBlock(d,true)}</div><div class="card"><h3>Navigasi cepat</h3><div class="row"><button class="btn secondary" onclick="goDate('${esc((prev.summary||{}).Tanggal)}')">Sebelumnya</button><button class="btn" onclick="goDate('${esc((next.summary||{}).Tanggal)}')">Berikutnya</button></div></div><div class="card"><h3>Ringkasan per minggu</h3><div class="weekgrid">${app.meta.weeks.map(w=>`<div class="week"><strong>${esc(w.week)}</strong><br><span class="small muted">${w.training} training / ${w.rest} rest | ${w.minutes} menit | ${w.km} km</span><div class="bar"><span style="width:${Math.min(100,Math.round((w.training/Math.max(w.days,1))*100))}%"></span></div></div>`).join('')}</div></div>`;
  bindChecks($('#today'));
}
window.goDate=(iso)=>{showTab('program');$('#q').value=iso;renderProgram();setTimeout(()=>{$(`details[data-date="${iso}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});$(`details[data-date="${iso}"]`)?.setAttribute('open','')},100)};
function renderProgram(){
  const q=($('#q')?.value||'').toLowerCase(); const stat=$('#stat')?.value||'';
  const blocks=app.days.filter(d=>{const s=d.summary||{};const joined=JSON.stringify(d).toLowerCase();return (!q||joined.includes(q))&&(!stat||s.Status===stat)}).map((d,i)=>renderDayBlock(d,i===0)).join('');
  const old=$('#programList'); if(old) old.innerHTML=blocks; bindChecks($('#programList'));
}
function programSection(){
  $('#program').innerHTML=`<div class="filters"><input id="q" placeholder="Cari tanggal, minggu, gerakan, alat"><select id="stat"><option value="">Semua</option><option>Training</option><option>Rest</option><option>Race</option></select></div><div id="programList"></div>`;
  $('#q').addEventListener('input',renderProgram);$('#stat').addEventListener('change',renderProgram);renderProgram();
}
function bindChecks(root=document){
  $$('input[type="checkbox"]',root).forEach(cb=>{cb.onchange=()=>{const item=cb.closest('[data-item]');setLS('done:'+item.dataset.item,cb.checked?'1':'0');item.classList.toggle('done',cb.checked)}});
}
function renderStations(){
  $('#stations').innerHTML=`<div class="card"><h2>Substitusi gym konvensional</h2><p class="muted small">Dipakai karena gym tidak memiliki sled push, sled pull, dan SkiErg.</p><div class="tableish">${app.stations.map(s=>`<div class="table-row"><strong>${esc(s['Gerakan / station'])}</strong><br><span class="muted small">${esc(s.Kategori)}</span><div class="kv" style="margin-top:8px"><div>Alternatif</div><div>${esc(s['Alternatif gym konvensional'])}</div><div>Alat</div><div>${esc(s.Alat)}</div><div>Beban</div><div>${esc(s['Beban / progresi'])}</div><div>Format</div><div>${esc(s['Format contoh'])}</div><div>Cues</div><div>${esc(s['Cues teknik'])}</div></div></div>`).join('')}</div></div><div class="card"><h2>Beban HYROX Men Open</h2><div class="tableish">${app.loads.map(l=>`<div class="table-row"><div class="row"><strong>${esc(l['Komponen resmi HYROX'])}</strong><span class="pill">${esc(l['Ada di gym?'])}</span></div><div class="kv" style="margin-top:8px"><div>Distance/Reps</div><div>${esc(l['Distance/Reps resmi'])}</div><div>Beban</div><div>${esc(l['Beban Men Open'])}</div><div>Substitusi</div><div>${esc(l['Substitusi di program'])}</div><div>Catatan</div><div>${esc(l.Catatan)}</div></div></div>`).join('')}</div></div>`;
}
function renderLog(){
  const rows=app.days.map(d=>{const s=d.summary||{}; const iso=s.Tanggal; const prefix='log:'+iso+':';
    return `<details><summary><div class="row"><div><div class="sum-title">${fmtShort(iso)} - ${esc(s['Fokus harian'])}</div><div class="sum-meta">${esc(s.Minggu)} | target ${esc(s['Estimasi durasi (menit)'])} menit | RPE ${esc(s['RPE target'])}</div></div>${dayStatusPill(s.Status)}</div></summary><div class="items"><div class="log-grid"><label class="small muted">Done<select data-log="${prefix}done"><option value=""></option><option>Yes</option><option>No</option></select></label><label class="small muted">Durasi<input inputmode="decimal" data-log="${prefix}duration" placeholder="menit"></label><label class="small muted">Run km<input inputmode="decimal" data-log="${prefix}km" placeholder="km"></label><label class="small muted">RPE<input inputmode="decimal" data-log="${prefix}rpe" placeholder="1-10"></label><label class="small muted">Sleep<input inputmode="decimal" data-log="${prefix}sleep" placeholder="jam"></label><label class="small muted">Soreness<input inputmode="decimal" data-log="${prefix}sore" placeholder="1-10"></label></div><label class="small muted">Notes<textarea data-log="${prefix}notes" placeholder="catatan sesi"></textarea></label></div></details>`;
  }).join('');
  $('#log').innerHTML=`<div class="card"><h2>Log harian lokal</h2><p class="muted small">Input disimpan di browser iPhone ini dengan localStorage. Tidak tersinkron otomatis ke Excel atau Notion.</p><div class="row"><button class="btn" onclick="exportCSV()">Export CSV</button><button class="btn secondary" onclick="clearLog()">Reset log</button></div></div><div class="stack">${rows}</div>`;
  $$('[data-log]').forEach(el=>{el.value=getLS(el.dataset.log,'');el.addEventListener('input',()=>setLS(el.dataset.log,el.value));el.addEventListener('change',()=>setLS(el.dataset.log,el.value));});
}
window.exportCSV=()=>{
  const fields=['date','focus','done','duration','km','rpe','sleep','sore','notes'];
  const lines=[fields.join(',')];
  app.days.forEach(d=>{const s=d.summary||{},iso=s.Tanggal,p='log:'+iso+':';const vals=[iso,s['Fokus harian'],getLS(p+'done'),getLS(p+'duration'),getLS(p+'km'),getLS(p+'rpe'),getLS(p+'sleep'),getLS(p+'sore'),getLS(p+'notes')].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"');lines.push(vals.join(','));});
  const blob=new Blob([lines.join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hyrox_log_export.csv';a.click();URL.revokeObjectURL(a.href);
};
window.clearLog=()=>{if(!confirm('Hapus semua log lokal?'))return;Object.keys(localStorage).filter(k=>k.startsWith('log:')||k.startsWith('done:')).forEach(k=>localStorage.removeItem(k));renderToday();renderProgram();renderLog();};
function renderGuide(){
  $('#guide').innerHTML=`<div class="card"><h2>Cara pakai di iPhone</h2><div class="stack"><div class="notice"><strong>Mode paling mudah:</strong> simpan file HTML ini ke Files/iCloud Drive, lalu buka ketika butuh. Semua data program sudah tertanam di file, tanpa internet.</div><div class="notice"><strong>Mode seperti app:</strong> upload folder PWA ke hosting HTTPS gratis, buka link di Safari, lalu Share -> Add to Home Screen. Setelah dibuka sekali, PWA dapat memakai cache browser untuk akses offline.</div><div class="notice"><strong>Notion:</strong> cocok bila ingin sinkron lintas device dan tampilan database, tetapi setup/import awal lebih mudah dari desktop. Untuk offline, download page/database di aplikasi Notion iOS.</div></div></div><div class="card"><h2>Catatan penggunaan</h2><p class="muted">Gunakan RPE target sebagai batas intensitas. Jika soreness 8-10, tidur rendah, atau HRV drop tajam, turunkan volume 20-40% dan pertahankan rest day.</p></div>`;
}
function showTab(id){$$('section').forEach(s=>s.classList.toggle('active-section',s.id===id));$$('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='today')renderToday();if(id==='program'&&!$('#programList'))programSection();if(id==='stations'&&!$('#stations').innerHTML)renderStations();if(id==='log')renderLog();if(id==='guide'&&!$('#guide').innerHTML)renderGuide();}
$$('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
initHero();renderToday();programSection();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
